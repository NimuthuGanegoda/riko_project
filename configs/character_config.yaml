# Prefer environment variables; never commit real credentials here.
OPENAI_API_KEY: "YOUR_OPENAI_API_KEY"
GEMINI_API_KEY: "YOUR_GEMINI_API_KEY" # Optional when Google ADC is configured.
ANTHROPIC_API_KEY: "YOUR_ANTHROPIC_API_KEY"
history_file: chat_history.json

# --- Default Brain ---
llm_provider: "gemini" 
model: "gemini-2.5-flash"

# --- Model Presets ---
model_options:
  gemini:
    - "gemini-2.5-pro"
    - "gemini-2.5-flash"
  openai:
    - "gpt-4.1"
    - "gpt-4.1-mini"
    - "gpt-4o-mini"
  anthropic:
    - "claude-sonnet-4-5"
    - "claude-haiku-4-5"
  ollama:
    - "llama3"
    - "mistral"

# --- Personality ---
local_llm_path: "models/riko-llm"
local_asr_path: "base.en"
backend_preference: "auto" # Options: auto, cuda, openvino, cpu_legacy

# Set to false for lightweight/free deployments (see docs/DEPLOYMENT_FREE.md)
# -- skips loading a local Whisper/GGUF ASR model at startup entirely, and
# the client falls back to browser-side speech recognition instead.
asr_enabled: true

# --- Cortana Mode (terminal chat only) ---
wake_word_enabled: false
wake_word: "riko"

presets:
  default:
    system_prompt: |
      You are a helpful assistant named Riko.
      You speak like a snarky anime girl.
      Always refer to the user as "senpai".

sovits_ping_config:
  text_lang: en
  prompt_lang : en
  ref_audio_path : "REPLACE_WITH_ABSOLUTE_PATH_TO/character_files/main_sample.wav" # Must be an absolute path on the machine running the GPT-SoVITS server
  prompt_text : This is a sample voice for you to just get started with because it sounds kind of cute but just make sure this doesn't have long silences.
